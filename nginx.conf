# ==============================================================================
# NGINX PRODUCTION REVERSE PROXY & SECURITY GATEWAY CONFIGURATION
# File: nginx.conf / sites-available/tiengnhat.edu.vn
# Standard: Mozilla Observatory A+, Qualys SSL Labs A+, OWASP Top 10
# ==============================================================================

# Rate Limiting Zones (Chống DoS / Brute-force & Quét vét cạn)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=speech_limit:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=honeypot_limit:10m rate=1r/m;

# ------------------------------------------------------------------------------
# 1. CƯỠNG BỨC CHUYỂN HƯỚNG HTTP SANG HTTPS (PORT 80 -> 443)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name tiengnhat.edu.vn www.tiengnhat.edu.vn;

    # Chuyển hướng 301 vĩnh viễn sang HTTPS cho toàn bộ lưu lượng
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. MÁY CHỦ CHÍNH BẢO MẬT HTTPS (PORT 443 SSL / HTTP/2)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name tiengnhat.edu.vn;

    root /var/www/tiengnhat;
    index index.html;

    # Cấu hình SSL / TLS hiện đại (Qualys SSL Labs A+)
    ssl_certificate /etc/letsencrypt/live/tiengnhat.edu.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tiengnhat.edu.vn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # =========================================================================
    # NHÓM 9 HTTP SECURITY HEADERS CẤP ĐỘ MÁY CHỦ (SERVER-LEVEL HEADERS)
    # Tự động gắn trên MỌI mã phản hồi (2xx, 3xx, 4xx, 5xx) qua từ khóa 'always'
    # =========================================================================

    # 1. Strict-Transport-Security (Ép HTTPS 2 năm kèm Preload)
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # 2. X-Frame-Options (Chặn Clickjacking tầng HTTP)
    add_header X-Frame-Options "DENY" always;

    # 3. X-Content-Type-Options (Chống MIME-sniffing)
    add_header X-Content-Type-Options "nosniff" always;

    # 4. Permissions-Policy (Cách ly quyền truy cập Camera, Mic, GPS)
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

    # 5. Content-Security-Policy (Chống tiêm mã XSS & Frame-ancestors)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https: blob:; media-src 'self' blob: https://speechgen.io https://translate.google.com https://dict.youdao.com data:; connect-src 'self' https://mazii.net https://speechgen.io https://inputtools.google.com https://www.google.com https://translate.google.com; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;

    # 6. Referrer-Policy (Bảo vệ URL chuyển tiếp)
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 7. Cross-Origin-Opener-Policy (Cách ly ngữ cảnh Process trình duyệt)
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # 8. Cross-Origin-Resource-Policy (Chống nhúng chéo tài nguyên)
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    # 9. X-XSS-Protection (Kích hoạt bộ lọc XSS Legacy)
    add_header X-XSS-Protection "1; mode=block" always;

    # =========================================================================
    # ĐỊNH TUYẾN 1: BẪY BOT HONEYPOT (/hidden-crawler-trap/)
    # =========================================================================
    location ^~ /hidden-crawler-trap {
        limit_req zone=honeypot_limit burst=2 nodelay;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header X-Crawler-Detected "true" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type text/plain;
        return 403 "403 Forbidden - Honeypot crawler trap triggered. Automated scraping attempt has been logged and client IP flagged for mitigation.\n";
    }

    # =========================================================================
    # ĐỊNH TUYẾN 2: SECURE API PROXY GIỌNG NÓI (/api/speech)
    # =========================================================================
    location ^~ /api/speech {
        limit_req zone=speech_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:3000/api/speech;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # =========================================================================
    # ĐỊNH TUYẾN 3: BẢO VỆ CHỐNG HOTLINK FILE ÂM THANH (.mp3)
    # =========================================================================
    location ~* \.(mp3|wav|ogg)$ {
        valid_referers none blocked server_names tiengnhat.edu.vn *.tiengnhat.edu.vn localhost 127.0.0.1;
        if ($invalid_referer) {
            return 403 "403 Forbidden - Audio hotlinking is strictly prohibited.\n";
        }
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # =========================================================================
    # ĐỊNH TUYẾN 4: PHỤC VỤ TRANG TĨNH & SPA FALLBACK
    # =========================================================================
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gzip nén dữ liệu tối ưu băng thông di động
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;
}
