<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="0; url=index.html#exam">

  <title>Chuyển hướng đến Phân Hệ Khảo Thí JLPT N5 &amp; N4...</title>
  <script>
    (function() {
      var h = window.location.hash || '';
      var target = 'index.html#exam';
      if (h) {
        var clean = h.replace(/^#/, '');
        target = 'index.html#exam/' + clean;
      }
      window.location.replace(target);
    })();
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f8fafc;
      color: #0f172a;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      padding: 16px;
      text-align: center;
      box-sizing: border-box;
    }
    .redirect-card {
      background: #ffffff;
      border: 1px solid rgba(226, 232, 240, 0.9);
      padding: 36px 28px;
      border-radius: 16px;
      max-width: 480px;
      box-shadow: 0 16px 36px rgba(15, 23, 42, 0.08);
    }
    .torii-icon {
      font-size: 2.4rem;
      margin-bottom: 12px;
      display: inline-block;
    }
    h2 {
      font-size: 1.35rem;
      color: #0f172a;
      margin-bottom: 12px;
      font-weight: 800;
    }
    p {
      color: #334155;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    .btn-redirect {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      background: #ff5a36;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 44px;
      box-shadow: 0 4px 12px rgba(255, 90, 54, 0.35);
      transition: all 0.2s ease;
    }
    .btn-redirect:hover {
      background: #ff7354;
      transform: translateY(-1px);
    }
  </style>
</head>
<body>
  <div class="redirect-card">
    <span class="torii-icon">⛩️</span>
    <h2>Hệ Thống Đã Hợp Nhất Thành Công!</h2>
    <p>
      Toàn bộ 50 đề thi, 1.000 câu hỏi và 50 bài đọc điền khuyết JLPT N5 &amp; N4 đã được chuyển sang trang học chính để đồng bộ tiến độ và bảng xếp hạng.
    </p>
    <a href="index.html#exam" class="btn-redirect">Vào Luyện Thi Ngay ➔</a>
  </div>
