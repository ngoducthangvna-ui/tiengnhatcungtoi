# ==============================================================================
# CẤU HÌNH CLOUDFLARE WORKER CHO WEBSITE TIẾNG NHẬT MINNA NO NIHONGO
# File: wrangler.toml
# ==============================================================================

name = "tiengnhatcungtoi"
main = "_worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# ------------------------------------------------------------------------------
# PHỤC VỤ TOÀN BỘ TÀI NGUYÊN TĨNH (STATIC ASSETS: HTML, CSS, JS, DATA)
# ------------------------------------------------------------------------------
[assets]
directory = "."
binding = "ASSETS"

# ------------------------------------------------------------------------------
# 1 & 2. LIÊN KẾT CƠ SỞ DỮ LIỆU CLOUDFLARE D1 (DATABASE BINDING)
# ------------------------------------------------------------------------------
# HƯỚNG DẪN KÍCH HOẠT D1 DATABASE:
# 1. Truy cập https://dash.cloudflare.com -> Storage & Databases -> D1 SQL Database
# 2. Bấm "Create database" -> đặt tên: minna-db -> Bấm "Create"
# 3. Sao chép "Database ID" (dãy ký tự UUID thật của bạn)
# 4. Mở khóa 4 dòng dưới đây bằng cách xóa dấu # và dán Database ID vào:
#
[[d1_databases]]
binding = "DB"
database_name = "minna-db"
database_id = "6ace647e-92db-4b69-ab65-908edf5ed842"

# ------------------------------------------------------------------------------
# 3. CẤU HÌNH GẮN TÊN MIỀN RIÊNG (CUSTOM DOMAIN & ROUTING)
# ------------------------------------------------------------------------------
# routes = [
#   { pattern = "tiengnhatcungtoi.com/*", zone_name = "tiengnhatcungtoi.com" },
#   { pattern = "www.tiengnhatcungtoi.com/*", zone_name = "tiengnhatcungtoi.com" }
# ]

# ------------------------------------------------------------------------------
# BIẾN MÔI TRƯỜNG HỆ THỐNG (ENVIRONMENT VARIABLES)
# ------------------------------------------------------------------------------
[vars]
# CANONICAL_DOMAIN = "tiengnhatcungtoi.com"
ENFORCE_SSL = "true"
SPEECHGEN_VOICE = "Akira"
JWT_SECRET = "minna-super-secret-jwt-key-2026-production"

# ------------------------------------------------------------------------------
# BÍ MẬT HỆ THỐNG ĐƯỢC MÃ HÓA (SECRETS)
# ------------------------------------------------------------------------------
# Chạy các lệnh sau trong terminal hoặc cài đặt tại Settings -> Variables trên Cloudflare:
#   npx wrangler secret put SPEECHGEN_TOKEN
#   npx wrangler secret put SPEECHGEN_EMAIL
#   npx wrangler secret put JWT_SECRET
